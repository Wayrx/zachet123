<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Babylon.js Skeleton Animation</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #uiContainer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }
        .control-button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .control-button:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        .info-panel {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="uiContainer">
        <div>
            <button id="walkButton" class="control-button">Walk</button>
            <button id="idleButton" class="control-button">Idle</button>
            <button id="stopButton" class="control-button">Stop All</button>
        </div>
        <div class="info-panel">
            <div>Hold Shift to slow down animation</div>
            <div id="speedInfo">Current Speed: 1.0x</div>
            <div id="animationInfo">Current Animation: None</div>
        </div>
    </div>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    
    <!-- Our modules -->
    <script src="config.js"></script>
    <script src="animationLoader.js"></script>
    <script src="animationFacade.js"></script>
    <script src="app.js"></script>
</body>
</html>
